</style>

function banner(){

  let t=ico('refresh',16)+` <b>Раунд ${round()}</b> · ${PF()?'Pathfinder 2e · ':''}`;

  else t+=`ходят игроки: сходили ${n-w.length} из ${n}`;

function xpBar(c){const x=c.xp||0,T=PF()?Array.from({length:20},(_,i)=>i*1000):XPT,l=PF()?Math.min(20,1+Math.floor(x/1000)):lvl(x),n=T[l],p=n?Math.round((x-T[l-1])/(n-T[l-1])*100):100;return '<div class="mut" style="margin-top:10px">'+ico('star',14)+' Уровень '+l+' · '+x+(n?' / '+n:'')+' XP</div><div class="bar"><i style="width:'+p+'%"></i></div>'}
function rollsCard(){const l=[...S.rolls].sort((a,b)=>b.ts-a.ts).slice(0,6);return l.length?`<div class="card"><h3>${ico('dice',18)} Броски</h3>${l.map(r=>`<span class="chip">${r.who?esc(r.who)+': ':''}${esc(r.txt)} → <b>${esc(r.total)}</b></span>`).join('')}</div>`:''}

  h+=`<div class="card"><h3>${ico('star',18)} Опыт</h3><div class="row"><select id="x_hero" style="flex:1"><option value="all">Все герои</option>${S.chars.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><input id="x_amt" type="number" placeholder="XP" style="width:100px"><button class="pri" data-xp="1">${ico('plus',18)} Начислить</button></div></div>`;

function vNotes(){return `<div class="card"><h3>${ico('note',18)} Заметки мастера</h3><div class="mut">Видны только вам</div><textarea id="notes" style="min-height:280px">${esc(drafts.notes||'')}</textarea><button class="pri" id="savenote">${ico('check',18)} Сохранить</button></div>`}
function shrink(file,max,cb,q0=.7,lim=220000,sq=false){const im=new Image();im.onload=()=>{let w=im.width,h=im.height,sx=0,sy=0;if(sq){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;w=h=m}let k=Math.min(1,max/Math.max(w,h)),q=q0,u;const cv=document.createElement('canvas'),x=cv.getContext('2d');for(let i=0;i<8;i++){cv.width=Math.round(w*k);cv.height=Math.round(h*k);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(im,sx,sy,w,h,0,0,cv.width,cv.height);u=cv.toDataURL('image/jpeg',q);if(u.length<lim)break;k*=.85;q=Math.max(.6,q-.04)}cb(u)};im.src=URL.createObjectURL(file)}
const mapDocs=s=>s.docs.map(d=>({id:d.id,...d.data()}));
function mkdb(lid){
  const C=new Map(),L=new Set();let ch;
  const fire=()=>L.forEach(f=>f());
  const snapDoc=p=>({exists:C.has(p),id:p.split('/').pop(),data:()=>C.get(p)});
  const snapCol=p=>({docs:[...C].filter(([k])=>k.startsWith(p+'/')&&!k.slice(p.length+1).includes('/')).map(([k,d])=>({id:k.split('/').pop(),data:()=>d}))});
  const on=(mk,cb)=>{const f=()=>cb(mk());L.add(f);f();return()=>L.delete(f)};
  const put=async(p,d)=>{C.set(p,d);fire();const{error}=await sb.from('docs').upsert({lobby_id:lid,path:p,data:d,updated_at:new Date().toISOString()});if(error)alert(error.message)};
  const doc=p=>({set:d=>put(p,d),update:d=>put(p,{...(C.get(p)||{}),...d}),
    delete:async()=>{C.delete(p);fire();await sb.from('docs').delete().eq('lobby_id',lid).eq('path',p)},
    get:async()=>snapDoc(p),onSnapshot:cb=>on(()=>snapDoc(p),cb)});
  const collection=p=>({add:d=>put(p+'/'+crypto.randomUUID(),d),onSnapshot:cb=>on(()=>snapCol(p),cb),doc:id=>doc(p+'/'+id)});
  return{doc,collection,stop(){if(ch)sb.removeChannel(ch)},async load(){
    ch=sb.channel('l'+lid).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'lobby_id=eq.'+lid},p=>{
      if(p.eventType==='DELETE')C.delete(p.old.path);else C.set(p.new.path,p.new.data);fire()}).subscribe();
    const{data}=await sb.from('docs').select('path,data').eq('lobby_id',lid);(data||[]).forEach(r=>C.set(r.path,r.data));fire()}};
}
let beat=null;const stopBeat=()=>{clearInterval(beat);beat=null};
const fmtT=sec=>{sec=sec|0;const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?h+' ч '+m+' мин':m?m+' мин':sec+' сек'};
const dispName=p=>p.display_name||p.username;
const pAva=(p,cls='ava')=>p.avatar&&p.avatar.startsWith('data:image/')?`<img class="${cls}" alt="" src="${esc(p.avatar)}">`:`<div class="${cls} ph">${ico(p.role==='master'?'crown':'user',cls.includes('big')?44:28)}</div>`;
async function showCabinet(){
  document.body.classList.add('out');gate.className='gate';if(db){stopBeat();db.stop();db=null}
  gate.innerHTML='<div class="card">Открываем кабинет…</div>';
  const me_=session.user.id;
  const[a,b,c]=await Promise.all([sb.from('lobby_time').select('*').eq('user_id',me_),sb.from('lobbies').select('*'),sb.from('docs').select('lobby_id,data').eq('path','characters/'+me_)]);
  const T=a.data||[],Ls=b.data||[],H=c.data||[];
  const total=T.reduce((x,t)=>x+t.seconds,0),visits=T.reduce((x,t)=>x+t.visits,0);
  const rank=total>=180000?'Ветеран гильдии':total>=36000?'Бывалый искатель':total>=3600?'Подающий надежды':'Новичок таверны';
  const since=new Date(session.user.created_at).toLocaleDateString('ru-RU');
  const rows=Ls.map(l=>({l,t:T.find(t=>t.lobby_id===l.id)||{seconds:0,visits:0},h:(H.find(x=>x.lobby_id===l.id)||{}).data})).sort((p,q)=>q.t.seconds-p.t.seconds);
  const max=Math.max(1,...rows.map(r=>r.t.seconds));
  gate.innerHTML=`<div style="margin-bottom:14px"><button id="c_back">← К лобби</button></div>
  <div class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><label class="avwrap" title="Сменить аватар">${pAva(profile,'ava big')}<input type="file" id="c_ava" accept="image/*" hidden></label>
  <div style="flex:1;min-width:0"><label>Имя в игре</label><input id="c_name" maxlength="30" value="${esc(profile.display_name||'')}" placeholder="${esc(profile.username)}"><button class="pri" id="c_save">${ico('check',18)} Сохранить</button></div></div>
  <div class="mut" style="margin-top:6px">Нажмите на аватар, чтобы сменить картинку</div><div id="g_err" class="err"></div>
  <div><span class="chip">${ico(profile.role==='master'?'crown':'user',14)} ${profile.role==='master'?'Мастер':'Игрок'}</span><span class="chip">${ico('star',14)} ${rank}</span><span class="chip">@${esc(profile.username)}</span><span class="chip">${ico('clock',14)} с ${since}</span></div>
  <div class="tiles"><div class="tile"><b>${fmtT(total)}</b>в играх</div><div class="tile"><b>${rows.length}</b>лобби</div><div class="tile"><b>${visits}</b>визитов</div></div></div>
  <h3 style="margin:18px 4px 10px">Мои приключения</h3>
  ${rows.map(({l,t,h})=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(l.name)}</h3><span class="chip">${l.master_id===me_?ico('crown',14)+' Мастер':ico('user',14)+' Игрок'}</span></div>
  ${h?`<div class="mut">Герой: <b>${esc(h.name)}</b>, ${esc(h.cls)}</div>`:''}
  <div class="mut">${ico('clock',14)} ${fmtT(t.seconds)} · визитов: ${t.visits}${t.last_seen?' · был(а) '+new Date(t.last_seen).toLocaleDateString('ru-RU'):''}</div>
  <div class="bar"><i style="width:${Math.round(t.seconds/max*100)}%"></i></div><button class="pri" data-open="${l.id}">${ico('next',18)} Войти</button></div>`).join('')||'<div class="card mut">Приключений пока нет — загляните в лобби!</div>'}`;
  document.getElementById('c_back').onclick=showLobbies;
  const bad=()=>setErr('Не сохранилось: выполните migration_cabinet.sql в Supabase');
  document.getElementById('c_ava').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,360,async u=>{const{error}=await sb.from('profiles').update({avatar:u}).eq('id',me_);if(error)return bad();profile.avatar=u;showCabinet()},.92,150000,true)};
  document.getElementById('c_save').onclick=async()=>{const n=v('c_name');const{error}=await sb.from('profiles').update({display_name:n||null}).eq('id',me_);if(error)return bad();profile.display_name=n||null;showCabinet()};
  gate.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>startGame(Ls.find(l=>l.id===b.dataset.open)));
}
let role='player',lobby=null,session=null,profile=null,LB=[];
const gate=document.getElementById('gate');
const em=l=>'dnd_'+l+'@gmail.com';
const setErr=t=>{const e=document.getElementById('g_err');if(e)e.textContent=t};
const ERR='color:#d9534f;margin:0 6px 8px';
let mode='in';
const friendly=m=>/already|registered/i.test(m)?'Такой логин уже занят':/invalid login/i.test(m)?'Неверный логин или пароль':/signups? .*disabled/i.test(m)?'Регистрация отключена в настройках Supabase':/rate limit|too many/i.test(m)?'Слишком много попыток, подождите минуту':/schema cache|does not exist/i.test(m)?'В Supabase не выполнен файл schema.sql':m;
function showAuth(){
  document.body.classList.add('out');gate.className='gate center';
  const up=mode==='up';
  gate.innerHTML=`<div class="card auth"><div class="logo">${ico('sword',34)}</div><h2>${up?'Создать аккаунт':'Добро пожаловать'}</h2>
  <div class="mut" style="text-align:center;margin-bottom:14px">${up?'Придумайте логин и пароль':'Собери партию. Брось кубик. Расскажи историю.'}</div>
  <div class="seg"><button data-role="player" class="${role==='player'?'on':''}">${ico('user',18)} Игрок</button><button data-role="master" class="${role==='master'?'on':''}">${ico('crown',18)} Мастер</button></div>
  <label>Логин</label><input id="g_login" autocomplete="username" autocapitalize="none" placeholder="например, dragon_77">
  <label>Пароль</label><input id="g_pass" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="минимум 6 символов">
  <div id="g_err" class="err"></div><button class="pri wide" id="g_go">${up?'Зарегистрироваться':'Войти'}</button>
  <div class="mut" style="text-align:center;margin-top:12px">${up?'Уже есть аккаунт?':'Нет аккаунта?'} <a href="#" id="g_sw">${up?'Войти':'Регистрация'}</a></div><div class="mut" style="text-align:center;margin-top:14px;font-size:.75rem">Сделано с любовью для настольных вечеров ♥</div></div>`;
  if(SUPABASE_URL.includes('YOUR-'))setErr('Сначала вставьте URL и ключ Supabase в index.html');
  gate.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;gate.querySelectorAll('[data-role]').forEach(x=>x.classList.toggle('on',x===b))});
  document.getElementById('g_sw').onclick=e=>{e.preventDefault();mode=up?'in':'up';showAuth()};
  const go=document.getElementById('g_go');
  const run=async()=>{
    const l=document.getElementById('g_login').value.trim().toLowerCase(),p=document.getElementById('g_pass').value;
    if(!/^[a-z0-9_]{3,30}$/.test(l))return setErr('Логин: 3–30 символов, только латиница, цифры и _');
    if(p.length<6)return setErr('Пароль: минимум 6 символов');
    setErr('');go.disabled=true;go.textContent='Подождите…';
    try{
      if(up){
        const{data,error}=await sb.auth.signUp({email:em(l),password:p});
        if(error)throw error;
        if(data.user&&data.user.identities&&!data.user.identities.length)throw new Error('already registered');
        if(!data.session)throw new Error('Отключите «Confirm email» в Supabase: Authentication → Sign In / Providers → Email');
        session=data.session;
        const{error:e2}=await sb.from('profiles').insert({id:data.user.id,username:l,role});if(e2)throw e2;
        profile={id:data.user.id,username:l,role};
      }else{
        const{data,error}=await sb.auth.signInWithPassword({email:em(l),password:p});
        if(error)throw error;session=data.session;
        let{data:pr}=await sb.from('profiles').select('*').eq('id',data.user.id).maybeSingle();
        if(!pr){const{error:e3}=await sb.from('profiles').insert({id:data.user.id,username:l,role});if(e3)throw e3;pr={id:data.user.id,username:l,role}}
        if(pr.role!==role){await sb.auth.signOut();throw new Error(pr.role==='master'?'Это аккаунт мастера — выберите «Мастер»':'Это аккаунт игрока — выберите «Игрок»')}
        profile=pr;
      }
      showLobbies();
    }catch(e){
      const m=String(e&&e.message||e);
      setErr(/failed to fetch|network/i.test(m)?'Нет связи с Supabase. Проверьте URL и ключ в index.html':friendly(m));
      go.disabled=false;go.textContent=up?'Зарегистрироваться':'Войти';
    }
  };
  go.onclick=run;gate.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')run()});
}
async function showLobbies(){
  document.body.classList.add('out');gate.className='gate';if(db){stopBeat();db.stop();db=null}
  const{data}=await sb.from('lobbies').select('*').order('created_at',{ascending:false});LB=data||[];
  const M=role==='master';
  gate.innerHTML=`<div class="card"><div class="row" style="flex-wrap:nowrap">${pAva(profile,'ava sm')}<div style="min-width:0"><h3 style="margin:0">${esc(dispName(profile))}</h3><div class="mut">${M?'Мастер':'Игрок'} · @${esc(profile.username)}</div></div></div><div class="row" style="margin-top:12px"><button id="g_cab">${ico('user',18)} Кабинет</button><button id="g_out">Выйти</button></div></div>
  <div class="card"><h3>${M?'Создать лобби':'Подключиться к лобби'}</h3>${M?'<input id="l_name" placeholder="Название кампании"><select id="l_sys"><option value="dnd5e">D&amp;D 5e</option><option value="pf2e">Pathfinder 2e</option></select>':'<input id="l_code" placeholder="Код лобби" autocapitalize="characters">'}
  <div id="g_err" class="mut" style="${ERR}"></div><button class="pri" id="l_go">${ico(M?'plus':'next',18)} ${M?'Создать':'Подключиться'}</button></div>
  ${LB.map(l=>`<div class="card"><h3>${esc(l.name)}</h3>${M?`<div class="chip">Код для игроков: <b>${esc(l.code)}</b></div>`:''}<div class="row"><button class="pri" data-open="${l.id}">${ico('next',18)} Войти в игру</button>${M?`<button data-dellb="${l.id}">${ico('trash',18)}</button>`:''}</div></div>`).join('')||'<div class="mut" style="text-align:center">Здесь пока тихо… самое время собрать партию!</div>'}`;
  document.getElementById('g_cab').onclick=showCabinet;
  document.getElementById('g_out').onclick=async()=>{await sb.auth.signOut();session=profile=null;showAuth()};
  document.getElementById('l_go').onclick=async()=>{setErr('');
    if(M){const n=v('l_name');if(!n)return;const nid=crypto.randomUUID();const{error}=await sb.from('lobbies').insert({id:nid,name:n});if(error)return setErr(error.message);await sb.from('docs').upsert({lobby_id:nid,path:'game/settings',data:{system:document.getElementById('l_sys').value}})}
    else{const c=v('l_code').toUpperCase();if(!c)return;const{error}=await sb.rpc('join_lobby',{c});if(error)return setErr('Лобби с таким кодом не найдено')}
    showLobbies()};
  gate.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>startGame(LB.find(l=>l.id===b.dataset.open)));
  gate.querySelectorAll('[data-dellb]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить лобби со всеми данными?')){await sb.from('lobbies').delete().eq('id',b.dataset.dellb);showLobbies()}});
}
async function startGame(lb){
  lobby=lb;uid=session.user.id;isDM=lb.master_id===uid;
  S={game:{round:1},story:[],items:[],chars:[],acts:[],rolls:[],map:{},tokens:{},settings:{}};rollSeen=null;dice=null;tab='story';drafts={};pendingImg=null;lastRoll=null;
  db=mkdb(lb.id);await db.load();
  stopBeat();sb.rpc('add_time',{l:lb.id,s:0,v:true});beat=setInterval(()=>{if(!document.hidden)sb.rpc('add_time',{l:lb.id,s:30})},30000);
  $('#logo').innerHTML=ico('sword',24)+'<b>'+esc(lb.name)+'</b>';
  if(isDM){const nd=await db.doc('notes/'+uid).get();if(nd.exists)drafts.notes=nd.data().text||''}
  const sub=(p,f)=>db.collection(p).onSnapshot(x=>{f(mapDocs(x));render()});
  db.doc('game/state').onSnapshot(x=>{S.game=x.exists?x.data():{round:1};render()});
  db.doc('game/map').onSnapshot(x=>{S.map=x.exists?x.data():{};render()});
  const mt=()=>{S.tokens={t:{...S.tk0,...S.tk1}}};
  db.doc('game/tokens').onSnapshot(x=>{S.tk0=x.exists?x.data().t||{}:{};mt();render()});
  db.collection('tokens').onSnapshot(x=>{S.tk1=Object.fromEntries(mapDocs(x).map(d=>[d.id,{x:d.x,y:d.y,mr:d.mr}]));mt();render()});
  db.doc('game/settings').onSnapshot(x=>{S.settings=x.exists?x.data():{};render()});sub('rolls',x=>{S.rolls=x;onRolls()});sub('story',x=>S.story=x);sub('items',x=>S.items=x);sub('lib',x=>S.lib=x);sub('characters',x=>S.chars=x);sub('actions',x=>S.acts=x);
  document.body.classList.remove('out');render();
}
document.getElementById('out').onclick=()=>showLobbies();
$('#cab').innerHTML=ico('user',16);$('#cab').onclick=()=>showCabinet();
(async()=>{
  const{data}=await sb.auth.getSession();
  if(data.session){session=data.session;const{data:pr}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(pr){profile=pr;role=pr.role;return showLobbies()}}
  showAuth();
})();
</script>
