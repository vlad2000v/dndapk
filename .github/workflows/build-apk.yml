name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bundle JS libraries into the app
        run: |
          cd app/src/main/assets
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" -o supabase.js
          curl -fsSL "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js" -o three.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js#supabase.js#; s#https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js#three.min.js#' index.html
          grep -n '<script src' index.html
          ls -la
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DnD-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
